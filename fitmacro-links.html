<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FitMacro App Links</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://www.fitmacro.ca/fitmacro-links" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Download FitMacro" />
  <meta property="og:description" content="Get FitMacro on the App Store or Google Play." />
  <meta property="og:url" content="https://www.fitmacro.ca/fitmacro-links" />
  <meta name="twitter:card" content="summary" />
  <style>
    :root {
      --bg: #030712;
      --card: #020617;
      --accent: #22c55e;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --border: rgba(148, 163, 184, 0.18);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #10203a, var(--bg));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .container { width: 100%; max-width: 390px; text-align: center; }
    h1 { font-size: 1.85rem; margin-bottom: 6px; }
    p { color: var(--muted); font-size: 0.95rem; margin-bottom: 20px; }
    .badge {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #bbf7d0;
      font-size: 0.78rem;
    }
    .button {
      display: block;
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 14px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #020617;
      border: 0;
    }
    .footer { margin-top: 18px; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <main class="container">
    <h1>FitMacro</h1>
    <p>AI calorie counter, macro tracker, and food scanner.</p>
    <div id="sourceBadge" class="badge">Source: organic</div>

    <a id="appStoreLink" class="button primary" href="https://apps.apple.com/us/app/fitmacro-ai-calorie-counter/id6753078641">Download on the App Store</a>
    <a id="googlePlayLink" class="button primary" href="https://play.google.com/store/apps/details?id=com.fitmacrotechnologies.fitmacro">Get it on Google Play</a>
    <a id="websiteLink" class="button" href="https://www.fitmacro.ca/calorie-counter">Product page</a>
    <a class="button" href="mailto:info@fitmacro.ca">Contact support</a>

    <div class="footer">&copy; FitMacro Technologies Inc.</div>
  </main>

  <script>
    (function () {
      function safeToken(value, fallback) {
        var raw = (value || '').toString().trim().toLowerCase();
        if (!raw) return fallback;
        return raw.replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-').slice(0, 60);
      }
      function withParams(base, params) {
        var url = new URL(base);
        Object.keys(params).forEach(function (key) {
          if (params[key]) url.searchParams.set(key, params[key]);
        });
        return url.toString();
      }
      var qs = new URLSearchParams(window.location.search);
      var source = safeToken(qs.get('src') || qs.get('utm_source'), 'organic');
      var medium = safeToken(qs.get('medium') || qs.get('utm_medium'), 'social');
      var campaign = safeToken(qs.get('campaign') || qs.get('utm_campaign'), 'fitmacro_links');

      document.getElementById('sourceBadge').textContent = 'Source: ' + source;
      document.getElementById('websiteLink').href = withParams('https://www.fitmacro.ca/calorie-counter', {
        utm_source: source,
        utm_medium: medium,
        utm_campaign: campaign
      });
      document.getElementById('appStoreLink').href = withParams('https://apps.apple.com/us/app/fitmacro-ai-calorie-counter/id6753078641', {
        ct: source + '_' + campaign
      });
      document.getElementById('googlePlayLink').href = withParams('https://play.google.com/store/apps/details?id=com.fitmacrotechnologies.fitmacro', {
        utm_source: source,
        utm_medium: medium,
        utm_campaign: campaign
      });
    })();
  </script>
</body>
</html>
