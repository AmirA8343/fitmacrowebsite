<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FitFace AI App Links</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://www.fitmacro.ca/fitface-links" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Download FitFace AI" />
  <meta property="og:description" content="Get FitFace AI on the App Store or Google Play." />
  <meta property="og:url" content="https://www.fitmacro.ca/fitface-links" />
  <meta name="twitter:card" content="summary" />
  <style>
    :root { color-scheme: dark; --bg: #020617; --card: #020617; --accent: #22c55e; --text: #e5e7eb; --muted: #9ca3af; --border: #1f2933; }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body { min-height: 100vh; min-height: 100svh; background: radial-gradient(ellipse at top, #111827 0, #020617 65%); color: var(--text); font-family: system-ui, -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI", sans-serif; -webkit-font-smoothing: antialiased; padding: 28px 20px; }
    a { color: inherit; text-decoration: none; }
    .site-brand { display: flex; align-items: center; justify-content: center; gap: 10px; width: fit-content; margin: 0 auto 32px; font-size: 12px; font-weight: 600; letter-spacing: .02em; color: var(--muted); }
    .site-brand img { width: 30px; height: 30px; border-radius: 9px; }
    .container { width: 100%; max-width: 460px; margin: 0 auto; padding: 36px 30px 28px; text-align: center; background: linear-gradient(155deg, #111827, #020617 55%); border: 1px solid var(--border); border-radius: 24px; box-shadow: 0 18px 45px rgba(0,0,0,.35); }
    .app-mark { display: flex; align-items: center; justify-content: center; width: 64px; height: 64px; margin: 0 auto 22px; border-radius: 18px; color: #020617; background: linear-gradient(135deg, #4ade80, #16a34a); font-size: 22px; font-weight: 800; box-shadow: 0 8px 28px rgba(34,197,94,.16); }
    .eyebrow { color: #86efac; font-size: 10px; font-weight: 650; letter-spacing: .16em; text-transform: uppercase; margin-bottom: 10px; }
    h1 { font-size: clamp(30px, 7vw, 38px); font-weight: 750; line-height: 1.15; letter-spacing: -.04em; margin-bottom: 12px; }
    p { color: var(--muted); font-size: 14px; line-height: 1.75; margin-bottom: 24px; text-wrap: pretty; }
    .offer { margin: 26px 0 22px; padding: 18px; border: 1px solid rgba(34,197,94,.2); border-radius: 16px; background: rgba(34,197,94,.05); }
    .offer strong { display: block; font-size: 16px; line-height: 1.5; color: var(--text); margin-bottom: 7px; }
    .offer p { margin: 0; font-size: 12px; line-height: 1.8; }
    .button { display: flex; align-items: center; justify-content: center; width: 100%; min-height: 50px; padding: 13px 18px; margin-bottom: 12px; border-radius: 999px; border: 1px solid #374151; background: radial-gradient(circle at top left, #111827, #020617 70%); color: var(--text); font-size: 14px; font-weight: 600; line-height: 1.5; transition: transform .16s ease, border-color .16s ease, background .16s ease; }
    .button:hover { transform: translateY(-1px); border-color: #6b7280; background: #111827; }
    .button.primary { color: #020617; border-color: rgba(16,185,129,.6); background: linear-gradient(135deg, #22c55e, #16a34a); box-shadow: 0 8px 24px rgba(16,185,129,.18); }
    .button.primary:hover { background: linear-gradient(135deg, #4ade80, #22c55e); }
    a:focus-visible { outline: 3px solid #86efac; outline-offset: 4px; }
    .section-label { color: var(--muted); font-size: 10px; text-transform: uppercase; letter-spacing: .13em; margin: 24px 0 14px; }
    .footer { margin-top: 26px; padding-top: 20px; border-top: 1px solid var(--border); color: var(--muted); font-size: 11px; line-height: 1.8; }
    .footer a:hover { color: var(--text); text-decoration: underline; }
    [hidden] { display: none !important; }
    @media (max-width: 380px) { body { padding: 20px 14px; } .container { padding: 28px 20px 22px; } .site-brand { margin-bottom: 24px; } }
    @media (prefers-reduced-motion: reduce) { .button { transition: none; } .button:hover { transform: none; } }
  </style>
</head>
<body>
  <a class="site-brand" href="/" aria-label="FitMacro Technologies home"><img src="/favicon.svg" alt="" width="30" height="30">FitMacro Technologies Inc.</a>
  <main class="container">
    <div class="app-mark" aria-hidden="true">FA</div>
    <p class="eyebrow">By FitMacro Technologies</p>
    <h1>FitFace AI</h1>
    <p>Face, body, skin, and wellness coaching with adaptive plans.</p>
    <div id="sourceBadge" class="badge" hidden>Source: organic</div>

    <p class="section-label">Get the mobile app</p>
    <a id="appStoreLink" class="button primary" href="https://apps.apple.com/us/app/fitface-ai-face-body-coach/id6760153476">Download on the App Store</a>
    <a id="googlePlayLink" class="button" href="https://play.google.com/store/apps/details?id=com.fitmacro.fitfaceai">Get it on Google Play</a>
    <a id="websiteLink" class="button" href="https://www.fitmacro.ca/fitface-ai">Product page</a>
    <a class="button" href="mailto:info@fitmacro.ca">Contact support</a>

    <footer class="footer"><a href="/">FitMacro Technologies Inc.</a><br><a href="/apps">Explore our apps</a> · <a href="mailto:info@fitmacro.ca">Support</a></footer>
  </main>

  <script>
    (function () {
      function safeToken(value, fallback) {
        var raw = (value || '').toString().trim().toLowerCase();
        if (!raw) return fallback;
        return raw.replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-').slice(0, 60);
      }
      function withParams(base, params) {
        var url = new URL(base);
        Object.keys(params).forEach(function (key) {
          if (params[key]) url.searchParams.set(key, params[key]);
        });
        return url.toString();
      }
      var qs = new URLSearchParams(window.location.search);
      var source = safeToken(qs.get('src') || qs.get('utm_source'), 'organic');
      var medium = safeToken(qs.get('medium') || qs.get('utm_medium'), 'social');
      var campaign = safeToken(qs.get('campaign') || qs.get('utm_campaign'), 'fitface_links');

      document.getElementById('sourceBadge').textContent = 'Source: ' + source;
      document.getElementById('websiteLink').href = withParams('https://www.fitmacro.ca/fitface-ai', {
        utm_source: source,
        utm_medium: medium,
        utm_campaign: campaign
      });
      document.getElementById('appStoreLink').href = withParams('https://apps.apple.com/us/app/fitface-ai-face-body-coach/id6760153476', {
        ct: source + '_' + campaign
      });
      document.getElementById('googlePlayLink').href = withParams('https://play.google.com/store/apps/details?id=com.fitmacro.fitfaceai', {
        utm_source: source,
        utm_medium: medium,
        utm_campaign: campaign
      });
    })();
  </script>
</body>
</html>
