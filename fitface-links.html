<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FitFace AI App Links</title>
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://www.fitmacro.ca/fitface-links" />
  <meta property="og:type" content="website" />
  <meta property="og:title" content="Download FitFace AI" />
  <meta property="og:description" content="Get FitFace AI on the App Store or Google Play." />
  <meta property="og:url" content="https://www.fitmacro.ca/fitface-links" />
  <meta name="twitter:card" content="summary" />
  <style>
    :root {
      --bg: #050712;
      --card: #080b18;
      --accent: #38bdf8;
      --text: #eef4ff;
      --muted: #a8b3c7;
      --border: rgba(148, 163, 184, 0.18);
      --radius: 14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #17233f, var(--bg));
      color: var(--text);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, Arial, sans-serif;
    }
    .container { width: 100%; max-width: 390px; text-align: center; }
    h1 { font-size: 1.85rem; margin-bottom: 6px; }
    p { color: var(--muted); font-size: 0.95rem; margin-bottom: 20px; }
    .badge {
      display: inline-flex;
      margin-bottom: 18px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(56, 189, 248, 0.08);
      border: 1px solid rgba(56, 189, 248, 0.45);
      color: #bae6fd;
      font-size: 0.78rem;
    }
    .button {
      display: block;
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 14px;
      text-decoration: none;
      color: var(--text);
      font-weight: 700;
      background: var(--card);
      border: 1px solid var(--border);
    }
    .primary {
      background: linear-gradient(135deg, #67e8f9, #2563eb);
      color: #020617;
      border: 0;
    }
    .examples {
      margin-top: 22px;
      text-align: left;
      background: rgba(8, 11, 24, 0.72);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 12px;
    }
    .examples strong { display: block; color: #d1d5db; font-size: 0.8rem; margin-bottom: 8px; }
    .examples a {
      display: block;
      color: #93c5fd;
      font-size: 0.78rem;
      margin-bottom: 6px;
      word-break: break-all;
      text-decoration: underline;
      text-underline-offset: 2px;
    }
    .footer { margin-top: 18px; color: var(--muted); font-size: 0.8rem; }
  </style>
</head>
<body>
  <main class="container">
    <h1>FitFace AI</h1>
    <p>Face, body, skin, and wellness coaching with adaptive plans.</p>
    <div id="sourceBadge" class="badge">Source: organic</div>

    <a id="appStoreLink" class="button primary" href="https://apps.apple.com/us/app/fitface-ai-face-body-coach/id6760153476">Download on the App Store</a>
    <a id="googlePlayLink" class="button primary" href="https://play.google.com/store/apps/details?id=com.fitmacro.fitfaceai">Get it on Google Play</a>
    <a id="websiteLink" class="button" href="https://www.fitmacro.ca/fitface-ai">Product page</a>
    <a class="button" href="mailto:info@fitmacro.ca">Contact support</a>

    <div class="examples">
      <strong>Use one link in each social profile:</strong>
      <a id="tiktokUrl" href="#"></a>
      <a id="youtubeUrl" href="#"></a>
      <a id="instagramUrl" href="#"></a>
    </div>

    <div class="footer">&copy; FitMacro Technologies Inc.</div>
  </main>

  <script>
    (function () {
      function safeToken(value, fallback) {
        var raw = (value || '').toString().trim().toLowerCase();
        if (!raw) return fallback;
        return raw.replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-').slice(0, 60);
      }
      function withParams(base, params) {
        var url = new URL(base);
        Object.keys(params).forEach(function (key) {
          if (params[key]) url.searchParams.set(key, params[key]);
        });
        return url.toString();
      }
      var qs = new URLSearchParams(window.location.search);
      var source = safeToken(qs.get('src') || qs.get('utm_source'), 'organic');
      var medium = safeToken(qs.get('medium') || qs.get('utm_medium'), 'social');
      var campaign = safeToken(qs.get('campaign') || qs.get('utm_campaign'), 'fitface_links');

      document.getElementById('sourceBadge').textContent = 'Source: ' + source;
      document.getElementById('websiteLink').href = withParams('https://www.fitmacro.ca/fitface-ai', {
        utm_source: source,
        utm_medium: medium,
        utm_campaign: campaign
      });
      document.getElementById('appStoreLink').href = withParams('https://apps.apple.com/us/app/fitface-ai-face-body-coach/id6760153476', {
        ct: source + '_' + campaign
      });
      document.getElementById('googlePlayLink').href = withParams('https://play.google.com/store/apps/details?id=com.fitmacro.fitfaceai', {
        utm_source: source,
        utm_medium: medium,
        utm_campaign: campaign
      });

      [
        { id: 'tiktokUrl', source: 'tiktok' },
        { id: 'youtubeUrl', source: 'youtube' },
        { id: 'instagramUrl', source: 'instagram' }
      ].forEach(function (item) {
        var url = withParams(window.location.origin + window.location.pathname, {
          src: item.source,
          medium: 'social',
          campaign: 'fitface_links'
        });
        var el = document.getElementById(item.id);
        el.href = url;
        el.textContent = item.source + ': ' + url;
      });
    })();
  </script>
</body>
</html>
