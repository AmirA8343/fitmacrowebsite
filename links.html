<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>FitMacros Links</title>
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="robots" content="noindex,follow" />
  <link rel="canonical" href="https://fitmacro.ca/links.html" />

  <style>
    :root {
      --bg: #030712;
      --card: #020617;
      --accent: #22c55e;
      --text: #e5e7eb;
      --muted: #9ca3af;
      --radius: 14px;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      min-height: 100vh;
      background: radial-gradient(circle at top, #020617, #030712);
      font-family: system-ui, -apple-system, Segoe UI, sans-serif;
      color: var(--text);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 24px;
    }

    .container {
      width: 100%;
      max-width: 380px;
      text-align: center;
    }

    h1 {
      font-size: 1.8rem;
      margin-bottom: 6px;
    }

    p {
      color: var(--muted);
      margin-bottom: 20px;
      font-size: 0.95rem;
    }

    .source-badge {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 18px;
      padding: 7px 10px;
      border-radius: 999px;
      background: rgba(34, 197, 94, 0.08);
      border: 1px solid rgba(34, 197, 94, 0.4);
      color: #bbf7d0;
      font-size: 0.78rem;
    }

    a.button {
      display: block;
      background: var(--card);
      border-radius: var(--radius);
      padding: 15px;
      margin-bottom: 14px;
      text-decoration: none;
      color: var(--text);
      font-weight: 600;
      transition: transform 0.15s ease, background 0.15s ease;
    }

    a.button:hover {
      background: #020625;
      transform: translateY(-2px);
    }

    .primary {
      background: linear-gradient(135deg, #22c55e, #16a34a);
      color: #020617;
    }

    .examples {
      margin-top: 22px;
      text-align: left;
      background: rgba(2, 6, 23, 0.7);
      border: 1px solid rgba(148, 163, 184, 0.15);
      border-radius: 12px;
      padding: 12px;
    }

    .examples strong {
      display: block;
      font-size: 0.8rem;
      margin-bottom: 8px;
      color: #d1d5db;
    }

    .examples a {
      display: block;
      color: #93c5fd;
      font-size: 0.78rem;
      word-break: break-all;
      margin-bottom: 6px;
      text-decoration: underline;
      text-underline-offset: 2px;
    }

    .footer {
      margin-top: 18px;
      font-size: 0.8rem;
      color: var(--muted);
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>FitMacros</h1>
    <p>Flagship health app from a multi-category app studio</p>

    <div id="sourceBadge" class="source-badge">Source: organic</div>

    <a id="appStoreLink" class="button primary" href="https://apps.apple.com/app/fitmacro/id6753078641">
      Download on App Store
    </a>

    <a id="websiteLink" class="button" href="https://fitmacro.ca">
      Website
    </a>

    <a class="button" href="https://tiktok.com/@fitmacros5">
      TikTok
    </a>

    <a class="button" href="mailto:info@fitmacro.ca">
      Contact Support
    </a>

    <div class="examples">
      <strong>Post these links by channel:</strong>
      <a id="tiktokUrl" href="#"></a>
      <a id="youtubeUrl" href="#"></a>
      <a id="instagramUrl" href="#"></a>
    </div>

    <div class="footer">
      © FitMacro Technologies Inc.
    </div>
  </div>

  <script>
    (function () {
      function safeToken(value, fallback) {
        var raw = (value || '').toString().trim().toLowerCase();
        if (!raw) return fallback;
        return raw.replace(/[^a-z0-9_-]/g, '-').replace(/-+/g, '-').slice(0, 60);
      }

      function withParams(base, params) {
        var url = new URL(base);
        Object.keys(params).forEach(function (key) {
          if (params[key]) {
            url.searchParams.set(key, params[key]);
          }
        });
        return url.toString();
      }

      var qs = new URLSearchParams(window.location.search);
      var source = safeToken(qs.get('src') || qs.get('utm_source'), 'organic');
      var medium = safeToken(qs.get('medium') || qs.get('utm_medium'), 'social');
      var campaign = safeToken(qs.get('campaign') || qs.get('utm_campaign'), 'bio_links');

      var sourceBadge = document.getElementById('sourceBadge');
      sourceBadge.textContent = 'Source: ' + source;

      var websiteUrl = withParams('https://fitmacro.ca', {
        utm_source: source,
        utm_medium: medium,
        utm_campaign: campaign,
        utm_content: 'links_page'
      });

      var appStoreUrl = withParams('https://apps.apple.com/app/fitmacro/id6753078641', {
        ct: source + '_' + campaign
      });

      document.getElementById('websiteLink').href = websiteUrl;
      document.getElementById('appStoreLink').href = appStoreUrl;

      var base = window.location.origin + window.location.pathname;
      var channels = [
        { id: 'tiktokUrl', source: 'tiktok' },
        { id: 'youtubeUrl', source: 'youtube' },
        { id: 'instagramUrl', source: 'instagram' }
      ];

      channels.forEach(function (item) {
        var url = withParams(base, {
          src: item.source,
          medium: 'social',
          campaign: 'bio_links'
        });
        var el = document.getElementById(item.id);
        el.href = url;
        el.textContent = item.source + ': ' + url;
      });
    })();
  </script>
</body>
</html>
